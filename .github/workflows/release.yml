name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # No dependency cache in release builds, so a poisoned cache can't reach published assets.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Check tag, manifest, versions.json and changelog agree
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          test "$(node -p "require('./manifest.json').version")" = "$tag" || { echo "tag != manifest.version"; exit 1; }
          node -e "if (!require('./versions.json')['$tag']) process.exit(1)" || { echo "versions.json lacks $tag"; exit 1; }
          # The section for this tag, up to the next section or the link references at the bottom.
          awk -v t="$tag" '$0 ~ "^## \\[" t "\\]" {f=1; next} /^## \[/ || /^\[[^]]+\]: / {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $tag"; exit 1; }
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check-size
      - uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css --title "${GITHUB_REF_NAME}" --notes-file notes.md
